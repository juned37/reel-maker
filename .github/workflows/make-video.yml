name: Make documentary video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "New documentary topic; leave blank to use selected JSON"
        required: false
        type: string

      script:
        description: "JSON script when topic is blank"
        required: false
        default: "scripts/world-before-islam.json"
        type: string

      minutes:
        description: "Target duration"
        required: false
        default: "3"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
          - "5"

      voice:
        description: "Narration voice"
        required: false
        default: "en-US-GuyNeural"
        type: choice
        options:
          - "en-US-GuyNeural"
          - "en-US-AndrewNeural"
          - "en-US-ChristopherNeural"
          - "en-GB-RyanNeural"

      watermark:
        description: "Optional watermark"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Generate or select script
        env:
          TOPIC: ${{ inputs.topic }}
          SCRIPT_IN: ${{ inputs.script }}
          MINUTES: ${{ inputs.minutes }}
          VOICE: ${{ inputs.voice }}
          WATERMARK: ${{ inputs.watermark }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

        run: |
          set -euo pipefail
          mkdir -p out

          if [ -n "$TOPIC" ]; then
            python reel.py generate "$TOPIC" out/documentary.json --minutes "$MINUTES"

            python - <<'PY'
          import json
          import os

          path = "out/documentary.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          data["voice"] = os.getenv("VOICE") or data.get("voice", "en-US-GuyNeural")
          data["watermark"] = os.getenv("WATERMARK", "")

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY

            SCRIPT_TO_RENDER="out/documentary.json"

          else
            SCRIPT_TO_RENDER="${SCRIPT_IN:-scripts/world-before-islam.json}"
          fi

          python -m engine.prepare_assets "$SCRIPT_TO_RENDER"

          python reel.py render "$SCRIPT_TO_RENDER" out/documentary.mp4 --tts edge

          cp "$SCRIPT_TO_RENDER" out/documentary-script.json

          CREDITS="$(dirname "$SCRIPT_TO_RENDER")/asset-credits.md"

          if [ -f "$CREDITS" ]; then
            cp "$CREDITS" out/asset-credits.md
          fi

      - name: Upload video and supporting files
        uses: actions/upload-artifact@v4
        with:
          name: reel-maker-documentary
          path: out/
          if-no-files-found: error
