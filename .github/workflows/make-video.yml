name: Make video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic. For several videos separate with ; (needs GEMINI_API_KEY secret)"
        required: false
      script:
        description: "OR a script file to render (used when topic is empty)"
        default: "scripts/ramadan.json"
        required: false
      watermark:
        description: "Handle shown at the bottom of the video"
        default: "yourhandle"
        required: false
      voice:
        description: "Voice: en-US-GuyNeural, en-US-AndrewNeural, en-US-ChristopherNeural, en-GB-RyanNeural"
        default: "en-US-GuyNeural"
        required: false

permissions:
  contents: write   # needed to attach videos to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          pip install edge-tts pillow numpy

      - name: Generate and render
        env:
          TOPICS: ${{ inputs.topic }}
          SCRIPT_IN: ${{ inputs.script }}
          WATERMARK: ${{ inputs.watermark }}
          VOICE: ${{ inputs.voice }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          mkdir -p out
          if [ -n "$TOPICS" ]; then
            i=0
            IFS=';' read -ra LIST <<< "$TOPICS"
            for T in "${LIST[@]}"; do
              T="$(echo "$T" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [ -z "$T" ] && continue
              i=$((i+1))
              echo "=== Video $i: $T ==="
              python reel.py generate "$T" "out/script-$i.json"
              python reel.py render "out/script-$i.json" "out/video-$i.mp4"
              mv out/notes.md "out/notes-$i.md"
              sleep 5
            done
          else
            python reel.py render "${SCRIPT_IN:-scripts/ramadan.json}" out/video-1.mp4
            mv out/notes.md out/notes-1.md
          fi

      - name: Save as artifact
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/

      - name: Publish Releases (easy to download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for V in out/video-*.mp4; do
            N="${V##*/video-}"; N="${N%.mp4}"
            FILES="$V"
            [ -f "out/script-$N.json" ] && FILES="$FILES out/script-$N.json"
            gh release create "video-${{ github.run_number }}-$N" $FILES \
              --title "Video ${{ github.run_number }}-$N" \
              --notes-file "out/notes-$N.md"
          done
