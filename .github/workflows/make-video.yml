name: Make vertical documentary video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "New documentary topic; leave blank to use the selected JSON"
        required: false
        type: string

      script:
        description: "JSON script when topic is blank"
        required: false
        default: "scripts/world-before-islam.json"
        type: string

      minutes:
        description: "Target duration for generated narration"
        required: false
        default: "3"
        type: choice
        options:
          - "2"
          - "3"
          - "4"
          - "5"

      voice:
        description: "Narration voice"
        required: false
        default: "en-US-GuyNeural"
        type: choice
        options:
          - "en-US-GuyNeural"
          - "en-US-AndrewNeural"
          - "en-US-ChristopherNeural"
          - "en-GB-RyanNeural"

      watermark:
        description: "Optional watermark"
        required: false
        default: ""
        type: string

      visual_style:
        description: "Visual rendering style"
        required: false
        default: "cinematic"
        type: choice
        options:
          - "cinematic"
          - "illustrated"
          - "editorial"
          - "photographic"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Verify tools
        run: |
          set -euo pipefail
          python --version
          ffmpeg -version
          ffprobe -version
          espeak-ng --version

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Generate or select documentary
        env:
          TOPIC: ${{ inputs.topic }}
          SCRIPT_IN: ${{ inputs.script }}
          MINUTES: ${{ inputs.minutes }}
          VOICE: ${{ inputs.voice }}
          WATERMARK: ${{ inputs.watermark }}
          VISUAL_STYLE: ${{ inputs.visual_style }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}

        run: |
          set -euo pipefail
          mkdir -p out

          echo "Selected visual style: $VISUAL_STYLE"

          if [[ "$VISUAL_STYLE" == "cinematic" && -z "${GEMINI_API_KEY:-}" ]]; then
            echo "Cinematic mode requires GEMINI_API_KEY for scene artwork."
            echo "Add GEMINI_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ -n "${TOPIC// /}" ]]; then
            if [[ -z "${GROQ_API_KEY:-}" && -z "${GEMINI_API_KEY:-}" ]]; then
              echo "Add GROQ_API_KEY or GEMINI_API_KEY to GitHub Actions secrets."
              exit 1
            fi

            python reel.py generate \
              "$TOPIC" \
              out/documentary.json \
              --minutes "$MINUTES"

            python - <<'PY'
          import json
          import os

          path = "out/documentary.json"

          with open(path, encoding="utf-8") as file:
              data = json.load(file)

          data["voice"] = (
              os.getenv("VOICE")
              or data.get("voice", "en-US-GuyNeural")
          )
          data["watermark"] = os.getenv("WATERMARK", "")

          with open(path, "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False, indent=2)
          PY

            SCRIPT_TO_RENDER="out/documentary.json"
          else
            SCRIPT_TO_RENDER="${SCRIPT_IN:-scripts/world-before-islam.json}"

            if [[ ! -f "$SCRIPT_TO_RENDER" ]]; then
              echo "Script not found: $SCRIPT_TO_RENDER"
              exit 1
            fi
          fi

          echo "Using script: $SCRIPT_TO_RENDER"

          if [[ "$VISUAL_STYLE" == "photographic" ]]; then
            python -m engine.prepare_assets "$SCRIPT_TO_RENDER"
          fi

          python reel.py render \
            "$SCRIPT_TO_RENDER" \
            out/documentary.mp4 \
            --tts edge \
            --style "$VISUAL_STYLE"

          cp "$SCRIPT_TO_RENDER" out/documentary-script.json

          CREDITS="$(dirname "$SCRIPT_TO_RENDER")/asset-credits.md"
          if [[ -f "$CREDITS" && "$CREDITS" != "out/asset-credits.md" ]]; then
            cp "$CREDITS" out/asset-credits.md
          fi

          NOTES="$(dirname "$SCRIPT_TO_RENDER")/render-notes.md"
          if [[ -f "$NOTES" && "$NOTES" != "out/render-notes.md" ]]; then
            cp "$NOTES" out/render-notes.md
          fi

      - name: Verify video format and streams
        run: |
          set -euo pipefail

          VIDEO="out/documentary.mp4"
          test -s "$VIDEO"
          test -s "out/documentary-script.json"

          python - <<'PY'
          import json
          import subprocess
          import sys

          video = "out/documentary.mp4"

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "stream=codec_type,codec_name,width,height,r_frame_rate",
                  "-show_entries",
                  "format=duration",
                  "-of", "json",
                  video,
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          data = json.loads(result.stdout)
          streams = data.get("streams", [])

          video_streams = [
              item for item in streams
              if item.get("codec_type") == "video"
          ]

          audio_streams = [
              item for item in streams
              if item.get("codec_type") == "audio"
          ]

          if len(video_streams) != 1:
              sys.exit("Expected exactly one video stream.")

          if not audio_streams:
              sys.exit("No audio stream found.")

          video_stream = video_streams[0]

          if video_stream.get("codec_name") != "h264":
              sys.exit("Video codec must be H.264.")

          if video_stream.get("width") != 1080:
              sys.exit("Video width must be 1080.")

          if video_stream.get("height") != 1920:
              sys.exit("Video height must be 1920.")

          if video_stream.get("r_frame_rate") != "30/1":
              sys.exit("Video frame rate must be 30 FPS.")

          if audio_streams[0].get("codec_name") != "aac":
              sys.exit("Audio codec must be AAC.")

          duration = float(data["format"]["duration"])

          if duration < 60:
              sys.exit(f"Video is unexpectedly short: {duration:.1f}s")

          print("Video verification passed.")
          print("Resolution: 1080x1920")
          print("Frame rate: 30 FPS")
          print(f"Duration: {duration:.2f} seconds")
          print("Video codec: H.264")
          print("Audio codec: AAC")
          PY

          echo "Generated files:"
          ls -lh out/

      - name: Upload video and supporting files
        uses: actions/upload-artifact@v4
        with:
          name: vertical-documentary-video
          path: out/
          if-no-files-found: error
          retention-days: 14
